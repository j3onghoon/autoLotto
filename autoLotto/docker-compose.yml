services:
  web:
    build:
    ports:
      - "8080:8080"
    image: auto-lotto
    networks:
      - auto-lotto-network
    environment:
      DATABASE_HOST: auto-lotto-postgres
      DATABASE_USER: auto_lotto
      DATABASE_PASSWORD: 1234
      DATABASE_NAME: auto_lotto
    depends_on:
      - db

  db:
    image: postgres
    networks:
      - auto-lotto-network
    environment:
      POSTGRES_USER: auto_lotto
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: auto_lotto
    volumes:
      - pgdata:/var/lib/postgresql/data

networks:
  auto-lotto-network:

volumes:
  pgdata:


